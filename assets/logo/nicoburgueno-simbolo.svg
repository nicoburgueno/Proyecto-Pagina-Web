<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="nicoburgueno">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500&amp;display=swap');
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    .cursor { animation: blink 1.1s steps(1) infinite }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none } }
  </style>
  <rect width="120" height="120" fill="#0b0b0b"/>
  <text x="22" y="70" font-family="'Geist Mono', ui-monospace, Consolas, monospace" font-weight="500" font-size="34" fill="#ffffff" letter-spacing="-1"><tspan fill="#6b6a64">&gt;</tspan>nb</text>
  <rect class="cursor" x="84" y="45" width="14" height="30" fill="#e5242b"/>
</svg>
